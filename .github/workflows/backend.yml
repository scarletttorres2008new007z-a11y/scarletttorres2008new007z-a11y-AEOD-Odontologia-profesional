# Compila el backend y pasa sus pruebas en los dos motores que usamos:
# MySQL 8.4 (producción) y MariaDB 10.4 (la de XAMPP en desarrollo).
name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas en ${{ matrix.base.nombre }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base:
          - nombre: MySQL 8.4
            imagen: mysql:8.4
            url: jdbc:mysql://127.0.0.1:3306/clinica_aeod_pruebas?createDatabaseIfNotExist=true
          - nombre: MariaDB 10.4 (XAMPP)
            imagen: mariadb:10.4
            url: jdbc:mariadb://127.0.0.1:3306/clinica_aeod_pruebas?createDatabaseIfNotExist=true
    services:
      base-de-datos:
        image: ${{ matrix.base.imagen }}
        env:
          MYSQL_ROOT_PASSWORD: pruebas
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppruebas"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar
        working-directory: backend
        env:
          TEST_DB_URL: ${{ matrix.base.url }}
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: pruebas
        run: mvn -B verify
