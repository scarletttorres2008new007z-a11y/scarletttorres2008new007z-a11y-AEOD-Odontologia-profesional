# Pruebas automáticas (mvn test): una base de datos real y SOLO para pruebas.
# Al empezar, las pruebas la borran y la vuelven a crear con las migraciones, así que nunca apuntes aquí a otra base.
# Por defecto usa XAMPP en tu equipo (base clinica_aeod_pruebas). GitHub Actions la cambia con TEST_DB_URL
# para probar en MySQL 8.4 y en MariaDB 10.4.
spring.datasource.url=${TEST_DB_URL:jdbc:mariadb://localhost:3306/clinica_aeod_pruebas?createDatabaseIfNotExist=true}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
app.zona-horaria=Europe/Madrid
app.cors.origenes=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000
app.datos-iniciales=true
