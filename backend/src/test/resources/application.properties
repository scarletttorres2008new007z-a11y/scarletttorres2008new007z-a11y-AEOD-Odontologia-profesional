# Tests: base de datos H2 en memoria en modo MySQL (no necesita SQL Server instalado).
spring.datasource.url=jdbc:h2:mem:clinica_landing;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
app.zona-horaria=Europe/Madrid
app.cors.origenes=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000
app.datos-iniciales=true
