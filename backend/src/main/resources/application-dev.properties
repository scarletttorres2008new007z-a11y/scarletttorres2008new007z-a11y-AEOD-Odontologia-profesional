# Entorno dev: tu equipo. Funciona sin variables de entorno con XAMPP (MariaDB, usuario root sin contraseña).
# La base clinica_aeod se crea sola y Flyway crea sus tablas en el primer arranque.
# Con MySQL 8.4 en lugar de XAMPP: DB_URL=jdbc:mysql://localhost:3306/clinica_aeod?createDatabaseIfNotExist=true y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/clinica_aeod?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Live Server (5500), servidor de Vite del software (5173), otros servidores locales (3000) e IntelliJ (63342).
app.cors.origenes=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:63342}

# Tratamientos, equipo y agenda de ejemplo (solo si las tablas están vacías).
app.datos-iniciales=true

# Seguridad en tu equipo. Sin JWT_SECRET se usa una clave aleatoria en cada arranque (el software renueva la
# sesión solo). Tu equipo usa http://localhost, así que la cookie de sesión no puede exigir HTTPS.
app.seguridad.jwt-secret=${JWT_SECRET:}
app.seguridad.clave-temporal=true
app.seguridad.cookie-segura=false

# Si no hay ningún administrador, se crea "admin" con una contraseña aleatoria que se muestra una vez en la consola.
app.admin-inicial.email=${ADMIN_EMAIL:admin@example.com}
app.admin-inicial.generar-password=true
