# Perfil opcional para MySQL: arrancar con SPRING_PROFILES_ACTIVE=mysql
# La base de datos clinica_landing se crea sola si no existe.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/clinica_landing?createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.use_nationalized_character_data=false
