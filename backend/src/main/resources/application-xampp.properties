# Perfil para XAMPP (MariaDB): arrancar con SPRING_PROFILES_ACTIVE=xampp
# Usuario por defecto de XAMPP: root sin contraseña.
# Crea antes la base de datos con database/crear-base-de-datos-mysql.sql (en utf8mb4).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/clinica_landing?createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.use_nationalized_character_data=false
