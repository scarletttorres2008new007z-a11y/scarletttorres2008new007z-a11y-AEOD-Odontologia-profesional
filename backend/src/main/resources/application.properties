spring.application.name=clinica-landing-api
server.port=8080

# ── Entornos ──
# dev (tu equipo, por defecto) · test (servidor de pruebas) · prod (producción).
# Se elige con la variable SPRING_PROFILES_ACTIVE. Cada entorno tiene su archivo application-<entorno>.properties.
spring.profiles.default=dev

# ── Base de datos ──
# Siempre por variables de entorno; en producción no hay valores por defecto y sin ellas el backend no arranca.
#   DB_URL      jdbc:mysql://servidor:3306/clinica_aeod (MySQL 8.4) o jdbc:mariadb://localhost:3306/clinica_aeod (XAMPP)
#   DB_USERNAME y DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Las tablas las crean y cambian las migraciones de src/main/resources/db/migration (Flyway).
# Hibernate solo comprueba al arrancar que las entidades coinciden con la base; nunca la modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Borrar la base entera con Flyway está prohibido en todos los entornos.
spring.flyway.clean-disabled=true

# ── JSON ──
# Los campos viajan en snake_case: precio_desde, tratamiento_id, fecha_preferida…
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# ── Errores: nunca exponer trazas al usuario ──
server.error.include-stacktrace=never
server.error.include-message=never

# ── Aplicación ──
# Zona horaria de la clínica (Madrid): decide qué es "hoy" y qué horas quedan libres.
app.zona-horaria=Europe/Madrid
# Orígenes que pueden llamar a la API desde el navegador (CORS), separados por comas. Nunca "*".
app.cors.origenes=${CORS_ALLOWED_ORIGINS}

# ── Agenda (citas online) ──
# Cada cuántos minutos se ofrece una hora de inicio (múltiplo de 15).
app.agenda.intervalo-minutos=30
# Margen mínimo entre ahora y la cita para poder reservarla online.
app.agenda.antelacion-minima-minutos=60
# Hasta cuántos días vista se puede reservar.
app.agenda.dias-reserva-maximos=180
# Días que se exploran para proponer "próximas opciones".
app.agenda.dias-busqueda-alternativas=30
# A partir de esta hora un horario cuenta como "tarde".
app.agenda.inicio-tarde=14:00
# false = las citas de la web entran PENDIENTES hasta que la clínica las verifica (el hueco queda reservado igual).
app.citas.confirmacion-automatica=false
# El paciente solo puede cancelar o reprogramar con al menos estas horas de antelación.
app.citas.cancelacion-antelacion-horas=4

# Datos de ejemplo al arrancar (solo en tablas vacías). Solo se activan en dev y test.
app.datos-iniciales=false
