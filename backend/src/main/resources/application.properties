spring.application.name=clinica-landing-api
server.port=8080

# ── MySQL ──
# La base de datos clinica_landing se crea sola si no existe.
# Usuario y contraseña se pueden cambiar con las variables DB_USER y DB_PASSWORD.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/clinica_landing?createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# update crea y ajusta las tablas a partir de las entidades (válido para desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── JSON ──
# Los campos viajan en snake_case: precio_desde, tratamiento_id, fecha_preferida…
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# ── Errores: nunca exponer trazas al usuario ──
server.error.include-stacktrace=never
server.error.include-message=never

# ── Aplicación ──
# Zona horaria de la clínica: decide qué es "hoy" al validar fechas de cita.
app.zona-horaria=Europe/Madrid
# Orígenes permitidos (CORS), separados por comas.
app.cors.origenes=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000
# Datos de prueba al arrancar (solo si las tablas están vacías). Poner en false en producción.
app.datos-iniciales=true
