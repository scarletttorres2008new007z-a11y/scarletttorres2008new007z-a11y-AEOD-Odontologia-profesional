# Entorno prod: producción.
# DB_URL, DB_USERNAME, DB_PASSWORD, CORS_ALLOWED_ORIGINS y JWT_SECRET llegan por variables de entorno
# (ver application.properties). Si falta alguna, el backend no arranca. Nunca se escriben contraseñas en este archivo.
# El primer administrador se crea con ADMIN_USERNAME, ADMIN_EMAIL y ADMIN_PASSWORD; después se quita ADMIN_PASSWORD.

# Sin datos de ejemplo: los datos reales se cargan desde el software de gestión.
app.datos-iniciales=false

# Sin documentación interactiva de la API (Swagger) en producción.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Detrás de un proxy con HTTPS (Nginx, el balanceador del proveedor…), usa la IP real del visitante y sabe que la
# petición llegó por HTTPS. Solo se fía de proxies de la red interna.
server.forward-headers-strategy=native
